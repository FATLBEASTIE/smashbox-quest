name: Build Quest APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Install Cordova
        run: npm install -g cordova
      - name: Compile Quest App
        run: |
          cordova create app com.smashboxvr.app "Smashbox VR"
          cd app
          rm -rf www/*
          cp -r ../web/* ./www/
          cordova platform add android
          cordova build android --release
      - name: Upload Finished APK
        uses: actions/upload-artifact@v3
        with:
          name: SmashboxVR-Quest-App
          path: app/platforms/android/app/build/outputs/apk/release/*.apk
