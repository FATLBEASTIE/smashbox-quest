name: Build Quest APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Native Wrapper Project
        run: |
          git clone https://github.com app-src
          cd app-src
          rm -rf app/src/main/assets/*
          cp -r ../web/* app/src/main/assets/
          sed -i 's|http://localhost:8080|https://netlify.app|g' app/src/main/assets/manifest.json || true
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: SmashboxVR-Quest-App
          path: app-src/app/build/outputs/apk/release/*.apk
