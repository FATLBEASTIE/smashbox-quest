name: Build Quest APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Android App Package
        uses: tttstudios/web-to-apk-action@v1
        with:
          url: 'https://netlify.app'
          app-name: 'Smashbox VR'
          package-id: 'com.smashboxvr.app'
      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: SmashboxVR-Quest-App
          path: ./**/*.apk
