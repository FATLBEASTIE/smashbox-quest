name: Build Quest APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Web App Wrapper Project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Smashbox VR" com.smashboxvr.app --web-dir=web
          npx cap add android
          
          # Overwrite the default manifest file with a perfect custom Quest VR template
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://android.com">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-feature android:name="android.hardware.vr.headset" android:required="true" />
              <application android:label="Smashbox VR" android:theme="@style/AppTheme" android:allowBackup="true" android:icon="@mipmap/ic_launcher">
                  <meta-data android:name="com.samsung.android.vr.application.mode" android:value="vr_only" />
                  <activity android:name=".MainActivity" android:exported="true" android:theme="@style/AppTheme.NoActionBar" android:screenOrientation="landscape" android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="com.oculus.intent.category.VR" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          npx cap sync
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: SmashboxVR-Quest-App
          path: android/app/build/outputs/apk/debug/*.apk
