name: Build Quest APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Web App to APK
        uses: akexorcist/web-to-apk-action@v1
        with:
          url: 'https://netlify.app'
          name: 'Smashbox VR'
          package_name: 'com.smashboxvr.app'

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: SmashboxVR-Quest-App
          path: ./**/*.apk
