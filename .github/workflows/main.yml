name: Build Quest APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Install Cordova and Generate Project
        run: |
          npm install -g cordova
          cordova create app com.smashboxvr.app "Smashbox VR"
          cd app
          rm -rf www/*
          cp -r ../web/* ./www/
          echo "android-minSdkVersion=29" >> config.xml
          echo "android-targetSdkVersion=33" >> config.xml
          cordova platform add android@12.0.0 --no-telemetry
          cordova build android --release --no-telemetry
      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: SmashboxVR-Quest-App
          path: app/platforms/android/app/build/outputs/apk/release/*.apk
