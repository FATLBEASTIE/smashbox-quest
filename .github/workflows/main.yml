name: Build Quest APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Create Android Project Wrapper
        run: |
          # Download a simple, clean Android web-wrapper template
          git clone https://github.com wrapper
          # Copy your game web files directly into its assets folder
          mkdir -p wrapper/app/src/main/assets/
          cp -r web/* wrapper/app/src/main/assets/
          # Set the app name
          sed -i 's/"h5wrapper"/"Smashbox VR"/g' wrapper/app/src/main/res/values/strings.xml
          # Compile the APK using pure Gradle
          cd wrapper
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Upload Finished APK
        uses: actions/upload-artifact@v3
        with:
          name: SmashboxVR-Quest-App
          path: wrapper/app/build/outputs/apk/release/*.apk
